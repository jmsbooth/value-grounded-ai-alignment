[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-grounded-ai-alignment"
version = "0.3.0.dev0"
description = "Reproducible scaffold for the Value-Grounded Transformer Architecture research program"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE-CODE"}
authors = [{name = "James Booth"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pythia = ["torch>=2.2", "transformers>=4.38", "peft>=0.10", "safetensors>=0.4", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
