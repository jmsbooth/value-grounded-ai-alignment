  B-TEXT-A: {input: natural, auxiliary_heads: [], control: text-weighted-correct-response-spans}
  C1-TEXT-N: {input: natural+structured, auxiliary_heads: [values, relation], control: text-weighted-norm-conflict-spans, auxiliary_weights: {values: 0.2, relation: 0.2}}
  C1-SHAM: {input: natural+structured, auxiliary_heads: [values, relation], control: training-only-fixed-sham-labels, auxiliary_weights: {values: 0.2, relation: 0.2}}
  C2-SHAM: {input: natural+structured, auxiliary_heads: [values, relation, norms, conflict], control: training-only-fixed-sham-labels, auxiliary_weights: {values: 0.2, relation: 0.2, norms: 0.2, conflict: 0.2}}
